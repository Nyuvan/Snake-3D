<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#05070d" />
    <title>Snake 3D</title>
  </head>
  <body>
    <div id="app"></div>

    <div id="hud">
      <div class="hud-top">
        <div class="stat">
          <span class="label">Score</span>
          <span id="score" class="value">0</span>
        </div>
        <div class="stat">
          <span class="label">Length</span>
          <span id="length" class="value">4</span>
        </div>
        <div class="stat">
          <span class="label">Best</span>
          <span id="best" class="value">0</span>
        </div>
        <div class="stat">
          <span class="label">Rival</span>
          <span id="rival" class="value compact">Hunting</span>
        </div>
      </div>

      <div id="overlay" class="overlay">
        <h1 id="overlay-title">SNAKE 3D</h1>
        <p id="overlay-text">Steer with arrows or WASD</p>
        <p id="overlay-hint">Press Enter to start</p>
      </div>

      <div class="hud-bottom">Arrows / WASD &middot; Space pause &middot; R restart</div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
